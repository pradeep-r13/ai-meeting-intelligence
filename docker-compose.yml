services:

    postgres:
      image: postgres:16
      container_name: meeting_postgres
      restart: always

      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: meeting_db

      ports: 
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data



    redis:
      image: redis:7
      container_name: meeting_redis
      restart: always

      ports:
        - "6379:6379"

      volumes:
        - redis_data:/data

    

    qdrant:
      image: qdrant/qdrant
      container_name: meeting_qdrant
      restart: always

      ports:
      - "6333:6333"

      volumes:
      - qdrant_data:/qdrant/storage

volumes:

  postgres_data:
  redis_data:
  qdrant_data:
